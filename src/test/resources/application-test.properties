# ============================================
# Test Profile Configuration
# ============================================
# Note: spring.profiles.active cannot be set in profile-specific file

# ============================================
# H2 In-Memory Database (Primary)
# ============================================
spring.datasource.primary.jdbc-url=jdbc:h2:mem:testdb_primary;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.primary.username=sa
spring.datasource.primary.password=
spring.datasource.primary.driver-class-name=org.h2.Driver
spring.datasource.primary.hikari.maximum-pool-size=5
spring.datasource.primary.hikari.minimum-idle=1

# ============================================
# H2 In-Memory Database (SMS)
# ============================================
spring.datasource.sms.jdbc-url=jdbc:h2:mem:testdb_sms;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.sms.username=sa
spring.datasource.sms.password=
spring.datasource.sms.driver-class-name=org.h2.Driver
spring.datasource.sms.hikari.maximum-pool-size=5
spring.datasource.sms.hikari.minimum-idle=1

# ============================================
# JWT Configuration
# ============================================
jwt.secret=V2lzZUFkVGVzdEpXVFNlY3JldEtleUZvclRlc3RpbmcyMDI1U2VjdXJlS2V5
jwt.access-token-validity=3600000
jwt.refresh-token-validity=604800000

# ============================================
# Auth Session-Key Configuration (plan v5 §4 Phase D)
# ============================================
