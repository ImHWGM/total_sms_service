# port Configuration
server.port=8100

# ============================================
# Logging Configuration
# ============================================
logging.file.path=D:/logs/WiseAd

# API Base URL (for absolute image URLs)
api.base.url=https://twisead-api.epopkon.com

# ============================================
# Primary Database (System/Member DB)
# ============================================
spring.datasource.primary.jdbc-url=jdbc:mariadb://localhost:3308/wise_ad
spring.datasource.primary.username=${DB_PRIMARY_USERNAME}
spring.datasource.primary.password=${DB_PRIMARY_PASSWORD}
spring.datasource.primary.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.primary.hikari.maximum-pool-size=10
spring.datasource.primary.hikari.minimum-idle=5
spring.datasource.primary.hikari.idle-timeout=30000
spring.datasource.primary.hikari.connection-timeout=20000

# ============================================
# SMS Database (Messaging Module DB)
# ============================================
spring.datasource.sms.jdbc-url=jdbc:mysql://127.0.0.1:3307/qvey
spring.datasource.sms.username=${DB_SMS_USERNAME}
spring.datasource.sms.password=${DB_SMS_PASSWORD}
spring.datasource.sms.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.sms.hikari.maximum-pool-size=8
spring.datasource.sms.hikari.minimum-idle=2
spring.datasource.sms.hikari.idle-timeout=30000
spring.datasource.sms.hikari.connection-timeout=20000

######
# UPLOAD CONFIG
######
upload.dir=D:\\upload\\wisead_syscuss
upload.dir.excel=D:\\upload\\wisead_syscuss\\excel
upload.dir.mmsfile=C:\\upload\\wisead_syscuss\\mmsfile
upload.dir.template.img=C:\\upload\\wisead_syscuss\\template
upload.dir.businessRegistration=C:\\upload\\wisead_syscuss\\96fdf2a96c5b9b3e4ec2163d29c66ab5da635db9c9c3a7c4f6ab45de0dba1ec5
survey.img.dir=C:\\upload\\wisead_syscuss\\survey
# Survey image URL prefix (for web access)
survey.img.url=https://twisead-api.epopkon.com/files/survey
# QR code file URL prefix (backend URL)
qr.url=https://twisead-api.epopkon.com/files/qrcode

# preview file img
spring.web.resources.static-locations=file:///C:/upload/wisead_syscuss/mmsfile/

# max file size (20MB)
upload.max=20485760

# file extension
upload.file.ext=pdf,doc,docx,ppt,pptx,xls,xlsx,jpg,jpeg,png,gif,bmp,zip,alz,7z,hwp
# img extension
upload.img.ext=jpg,png,gif,bmp,jpeg
# img mime type
upload.img.mime=image/jpeg,image/png,image/gif
# upload img max size(over resize)
upload.img.width=600
upload.img.height=600

# CDN
cdn.path=

# LOSE_PERCENT
lose.percent=0
new.lose.percent=0

# Hiworks Email Settings
mail.hiworks.url=https://api.hiworks.com
mail.hiworks.id=service
mail.hiworks.office-token=${MAIL_HIWORKS_OFFICE_TOKEN}

#dev_environment
sms.api.id=${SMS_API_ID}
sms.api.pw=${SMS_API_PW}
sms.api.client_id=${SMS_API_CLIENT_ID}
sms.api.client_secret=${SMS_API_CLIENT_SECRET}
sms.api.url=https://api.gmgo.co.kr:7300

# wisead URL
wisead.url=https://twisead.epopkon.com

# Frontend URL (for password reset email links)
wisead.base-url=https://twisead.epopkon.com

kcp.site_cd=A7TD3
kcp.enc_key=${KCP_ENC_KEY}
kcp.web_siteid=
kcp.ret_url=https://twisead-api.epopkon.com/api/front/auth/kcp/callback
kcp.gw_url=https://cert.kcp.co.kr/kcp_cert/cert_view.jsp

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

shorten.api.url=https://shorten.epopkon.com/api/shorten

standard.rate.vat=1.1

# ============================================
# JWT Configuration
# ============================================
# Base64 encoded secret key (256-bit minimum)
jwt.secret=${JWT_SECRET}
# Access token validity (1 minute = 60000ms)
jwt.access-token-validity=1800000
# Refresh token validity (5 hour = 18000000ms)
jwt.refresh-token-validity=18000000

# ============================================
# Auth Session-Key Configuration (plan v5 §4 Phase D, #v3-4)
# ============================================
# ⚠ jwt.secret 과 반드시 다른 값. @Value default 폴백 금지 (N13).
auth.session-key.secret=${AUTH_SESSION_KEY_SECRET}