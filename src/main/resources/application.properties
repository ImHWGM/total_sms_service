spring.application.name=WiseAd
spring.profiles.active=@activatedProperties@

# Nginx 리버스 프록시 환경. X-Forwarded-For/Proto 헤더를 Spring이 자동으로 처리하도록 설정.
# 이 설정으로 HttpServletRequest.getRemoteAddr()가 실제 클라이언트 IP를 반환한다.
server.forward-headers-strategy=framework

# SMS OTP 발신번호 (MultiMessageService 우회 발송 전용, plan v5 §4 Phase B-1)
# 일반 SMS 발송 경로(BalanceService 차감)와 분리하여 인증 SMS를 무료 발송한다.
sms.otp.sender=${SMS_OTP_SENDER:15880000}

# Auth session-key HMAC secret (plan v5 §4 Phase D, #v3-4)
# ⚠ jwt.secret 과 반드시 다른 값. @Value default 폴백 금지 (N13).
auth.session-key.secret=V2lzZUFkU2Vzc2lvbktleVNlY3JldEZvckxvY2FsRGV2ZWxvcG1lbnQyMDI1U2VjdXJlS2V5
