spring.application.name=WiseAd
spring.profiles.active=@activatedProperties@

# Nginx 리버스 프록시 환경. X-Forwarded-For/Proto 헤더를 Spring이 자동으로 처리하도록 설정.
# 이 설정으로 HttpServletRequest.getRemoteAddr()가 실제 클라이언트 IP를 반환한다.
server.forward-headers-strategy=framework

# @Scheduled 작업용 스레드풀 크기 (기본 1 → 5).
# 프로젝트 전역에 @Scheduled 작업이 15개 이상이며 기본값(단일 스레드)에서는
# 무거운 DB 배치(예: WalletLotBatchService, FailedMessageRefundBatchService)가
# 실행되는 동안 다른 cleanup 작업(OTP/세션키/rate-limit 정리)이 모두 지연된다.
# 풀을 5로 늘려 작업 간 head-of-line blocking 을 방지한다.
# 주의: 동시 실행이 가능해지므로 같은 자원을 만지는 작업은 thread-safe 해야 한다
#       (현재 OTP 저장소는 ConcurrentHashMap, 배치는 서로 다른 테이블 대상이라 안전).
spring.task.scheduling.pool.size=5

# SMS OTP 발신번호 (MultiMessageService 우회 발송 전용, plan v5 §4 Phase B-1)
# 일반 SMS 발송 경로(BalanceService 차감)와 분리하여 인증 SMS를 무료 발송한다.
sms.otp.sender=${SMS_OTP_SENDER:16443614}

# Auth session-key HMAC secret (plan v5 §4 Phase D, #v3-4)
# ⚠ jwt.secret 과 반드시 다른 값. @Value default 폴백 금지 (N13).
auth.session-key.secret=${AUTH_SESSION_KEY_SECRET}

# ── PR1: 로그인 잠금 정책 (AC36 kill-switch) ────────────────────────────────
# lockoutV2.enabled=true (default): isLocked() 는 LOCKED_UNTIL 만 사용 (10분 자동 해제)
# false 토글 시: 운영 사고 대응용 — User.isLocked() fallback 경로 활성화 검토 후 코드 분기 도입
#   (현재 구현은 LOCKED_UNTIL only; kill-switch 사용 시 추가 패치 필요)
security.lockoutV2.enabled=true

# ── PR3: 휴면/탈퇴 배치 설정 ──────────────────────────────────────────────────
# dryRun=true: 첫 배포 안전장치 — DB 변경 없이 INFO 로그만 출력 (AC25)
# staging/prod 에서 실제 실행하려면 false 로 변경
dormancy.batch.dryRun=true
# 일일 처리 상한 (Scenario 2: 메일 폭주 방지)
dormancy.batch.dailyLimit=1000
# 복구 URL (휴면 예정 이메일 본문에 삽입 — 환경별로 재정의 필요)
dormancy.batch.recoverUrl=https://wisead.kr/dormant-recovery
